spring.application.name=fairshareapi
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI}
keycloak.admin.clientId=${KEYCLOAK_ADMIN_CLIENT_ID}
keycloak.admin.clientSecret=${KEYCLOAK_ADMIN_CLIENT_SECRET}
keycloak.app.clientId=${KEYCLOAK_APP_CLIENT_ID}
keycloak.baseUrl=${KEYCLOAK_BASE_URL}

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG

spring.jpa.hibernate.ddl-auto=update

cloud.aws.credentials.accessKey=${AWS_ACCESS_KEY}
cloud.aws.credentials.secretKey=${AWS_SECRET_KEY}
cloud.aws.region.static=${REGION_STATIC}
cloud.aws.s3.bucket=${S3_BUCKET}
cloud.aws.s3.endpoint=${S3_ENDPOINT:}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

