services:
  mysql:
    image: mysql:latest
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: piyu2009
      MYSQL_DATABASE: fairshare_db
    volumes:
      - mysql-data:/var/lib/mysql

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    ports:
      - "8333:8333"
      - "8888:8888"
      - "9333:9333"
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: secret
      S3_BUCKET: fairshare-bucket
    volumes:
      - seaweed-data:/data

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: start-dev
    ports:
      - "8081:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
    volumes:
      - keycloak-data:/opt/keycloak/data


volumes:
  mysql-data:
  seaweed-data:
  keycloak-data:
